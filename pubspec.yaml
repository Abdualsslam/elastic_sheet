name: elastic_sheet
description: A physics-driven Flutter surface for anchor-based expansion, liquid spring motion, dynamic sizing, and partial actions.
topics:
  - animation
  - spring
  - expandable
  - bottom-sheet
  - surface
version: 0.2.0
homepage: https://github.com/Abdualsslam/elastic_sheet
repository: https://github.com/Abdualsslam/elastic_sheet
issue_tracker: https://github.com/Abdualsslam/elastic_sheet/issues

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

screenshots:
  - description: 'Care Desk showcase - elastic expand/collapse in action'
    path: doc/Care Desk showcase.gif
  - description: 'Spring presets - configurable spring physics'
    path: doc/presets.gif
  - description: 'Anchor system - compact mode'
    path: doc/anchor compact.gif
  - description: 'Anchor system - grid mode'
    path: doc/anchor grid.gif
